name: Feature request
description: Propose a new capability or workflow.
title: 'feat: '
labels: ['enhancement', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        StackNext is local-first and read-only. Proposals that add a cloud service, outbound telemetry, automatic source edits, SQL/EXPLAIN execution or an LLM provider are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What debugging or regression question cannot you answer today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful behavior, including the evidence it would expose.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - CLI
        - Dashboard
        - Instrumentation
        - Drizzle adapter
        - Prisma adapter
        - Diagnostics
        - Coverage
        - Runtime regression
        - Playwright
        - MCP
        - Agent skill
        - Documentation
        - Packaging and distribution
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and read-only impact
      description: Does this capture a new field, change redaction, add network I/O or mutate data? Explain.
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I checked existing issues and documentation.
          required: true
        - label: I can help test this change.
          required: false
