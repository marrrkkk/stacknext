name: Dev container

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/devcontainer.yml'
  pull_request:
    paths:
      - '.devcontainer/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/devcontainer.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcontainer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  devcontainer:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The action runs the Dev Containers CLI as UID 1000 inside its own
      # container, while the hosted runner checks out files as UID 1001. Match
      # the workspace to the action container user (not the runner UID) so
      # postCreateCommand can install.
      - name: Align workspace ownership with the container user
        run: sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"

      - name: Build and test in the dev container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          imageName: stacknext-devcontainer
          push: never
          runCmd: pnpm lint && pnpm typecheck && pnpm test && pnpm build
