name: Dev container

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/devcontainer.yml'
  pull_request:
    paths:
      - '.devcontainer/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/devcontainer.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcontainer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  devcontainer:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build and test in the dev container
        uses: devcontainers/ci@v0.3
        with:
          imageName: stacknext-devcontainer
          runCmd: pnpm lint && pnpm typecheck && pnpm test && pnpm build
