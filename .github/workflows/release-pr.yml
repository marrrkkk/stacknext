name: Release PR

# Conventional commits on main are batched into one release PR. Merging the
# release PR changes the package versions, which triggers the Release workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  plan:
    name: Plan release PR
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'push' ||
       !startsWith(github.event.head_commit.message || '', 'chore(release):'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      branch: release/v${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Plan the next version
        id: plan
        run: >-
          node scripts/plan-release.mjs
          --github-output "$GITHUB_OUTPUT"
          --summary "$RUNNER_TEMP/release-plan.md"

      - name: Prepare the version bump
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: node scripts/prepare-release.mjs --version "$VERSION"

      - name: Commit, push and open the release PR
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          SUMMARY: ${{ runner.temp }}/release-plan.md
        run: |
          set -euo pipefail
          branch="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          if git diff --cached --quiet; then
            echo "Release branch is already up to date."
          else
            git commit -m "chore(release): $VERSION"
            git push --force origin "$branch"
          fi

          existing=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "chore: release $VERSION" --body-file "$SUMMARY"
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: release $VERSION" \
              --body-file "$SUMMARY"
          fi

          # Pull requests created with GITHUB_TOKEN do not trigger workflows.
          # Dispatch CI explicitly on the release branch so the required checks
          # are attached to the pull request head before it can be merged.
          for attempt in 1 2 3 4 5; do
            if gh workflow run ci.yml --ref "$branch"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Could not dispatch CI on $branch."
          exit 1
