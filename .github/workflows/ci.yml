name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Documentation checks
        run: pnpm check:docs

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

  package-archives:
    name: Package archives
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pack and validate archives
        run: pnpm test:packages

      - name: Upload archive manifest
        uses: actions/upload-artifact@v4
        with:
          name: package-manifest
          path: release/validation/manifest.json
          if-no-files-found: error

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: stacknext:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker runtime integration
        run: node scripts/docker-integration.mjs --image stacknext:ci --require-docker

  e2e:
    name: End-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Run e2e smoke test
        run: pnpm test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          CI: 'true'

  consumer:
    name: Consumer (Node ${{ matrix.node }}, Next ${{ matrix.next }}, ${{ matrix.pm }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: 22, next: 16.4.3, pm: npm }
          - { node: 24, next: 15.5.28, pm: pnpm }
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install archives into an external Next.js app
        run: pnpm test:consumer --next ${{ matrix.next }} --pm ${{ matrix.pm }} --skip-build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          CI: 'true'
