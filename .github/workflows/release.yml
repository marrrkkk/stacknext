name: Release

# Automatic after a Release PR merges (the version in packages/*/package.json
# changes on main), plus a manual dispatch for bootstrap, recovery and hotfixes.
on:
  push:
    branches: [main]
    paths:
      - 'packages/*/package.json'
  workflow_dispatch:
    inputs:
      version:
        description: Exact version to publish (for example 0.6.0)
        required: true
        type: string
      dry_run:
        description: Build, validate and dry-run every npm publish
        required: true
        default: true
        type: boolean
      confirm:
        description: Type "publish" to allow a real publication
        required: false
        default: ''
        type: string
      resume:
        description: Skip packages already published at this exact version
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.detect.outputs.version }}
      release: ${{ steps.detect.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and tag state
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
            release=true
          else
            version=$(node -p "require('./packages/core/package.json').version")
            if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              echo "Version $version already has tag v$version; nothing to publish."
              release=false
            else
              release=true
            fi
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version '$version'. Expected an exact x.y.z version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version=$version release=$release"

  compatibility:
    name: Compatibility Node ${{ matrix.node }} / Next ${{ matrix.next }} / ${{ matrix.pm }}
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        node: [22, 24, 26]
        next: [15.5.28, 16.4.3]
        pm: [npm, pnpm]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: External consumer smoke
        run: pnpm test:consumer --next ${{ matrix.next }} --pm ${{ matrix.pm }} --skip-build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          CI: 'true'

  publish:
    name: Publish ${{ needs.detect.outputs.version }}
    needs: [detect, compatibility]
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - name: Require the default branch
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Releases must run from $DEFAULT_BRANCH, not $REF."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Check npm CLI
        run: |
          node --input-type=module -e "
            import { execFileSync } from 'node:child_process'
            const version = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim()
            const [major, minor, patch] = version.split('.').map(Number)
            const supported =
              major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)))
            console.log('npm', version)
            if (!supported) {
              console.error('npm 11.5.1 or newer is required for trusted publishing.')
              process.exit(1)
            }
          "

      - name: Require explicit confirmation for a real publication
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && inputs.confirm != 'publish' }}
        run: |
          echo "Refusing to publish: set confirm to 'publish' or enable dry_run."
          exit 1

      - name: Verify requested version matches every package
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs'
            const version = process.env.VERSION
            const files = ['package.json', 'apps/example-next-app/package.json']
            for (const entry of ['core','diagnostics','regression','next','drizzle','prisma','playwright','mcp','dashboard','cli']) {
              files.push('packages/' + entry + '/package.json')
            }
            const bad = []
            for (const file of files) {
              const manifest = JSON.parse(readFileSync(file, 'utf8'))
              if (manifest.version !== version) bad.push(file + ': ' + manifest.version)
            }
            const constants = [
              ['packages/cli/src/version.ts', 'CLI_VERSION'],
              ['packages/core/src/types.ts', 'STACKNEXT_SDK_VERSION'],
              ['packages/diagnostics/src/engine.ts', 'DIAGNOSTICS_ENGINE_VERSION'],
              ['packages/regression/src/constants.ts', 'STACKNEXT_REGRESSION_ENGINE_VERSION'],
            ]
            for (const [file, label] of constants) {
              const source = readFileSync(file, 'utf8')
              if (!source.includes(\"'\" + version + \"'\")) bad.push(label)
            }
            const skill = readFileSync('skills/stacknext-debugging/SKILL.md', 'utf8')
            if (!skill.includes('version: \"' + version + '\"')) bad.push('Agent Skill version')
            if (bad.length) {
              console.error('Version mismatch for ' + version + ':\n' + bad.join('\n'))
              process.exit(1)
            }
            console.log('All manifests and constants match ' + version)
          "

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit --prod

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Documentation checks
        run: pnpm check:docs

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package archives
        run: pnpm test:packages

      - name: End-to-end
        run: pnpm test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          CI: 'true'

      - name: Benchmarks
        run: |
          pnpm benchmark
          pnpm benchmark:diagnostics
        env:
          CI: 'true'

      - name: Publish dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: pnpm release:publish --version "$VERSION" --dry-run --skip-gates

      - name: Publish with provenance
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          RESUME: ${{ inputs.resume || 'false' }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          args=(--version "$VERSION" --publish --skip-gates)
          if [ "$RESUME" = "true" ]; then
            args+=(--resume)
          fi
          pnpm release:publish "${args[@]}"

      - name: Upload release manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ needs.detect.outputs.version }}
          path: |
            release/publish/manifest.json
            release/publish/*.tgz
          if-no-files-found: warn
          retention-days: 14

  finalize:
    name: Tag and release ${{ needs.detect.outputs.version }}
    needs: [detect, publish]
    if: >-
      needs.publish.result == 'success' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists."
          else
            git tag -a "$tag" -m "StackNext $VERSION"
            git push origin "$tag"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists."
          else
            notes="$RUNNER_TEMP/release-notes.md"
            node scripts/release-notes.mjs --version "$VERSION" --out "$notes"
            gh release create "$tag" --title "StackNext $VERSION" --notes-file "$notes"
          fi
