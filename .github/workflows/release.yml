name: Release

# Manual-only. Never triggers on push, tags or a schedule.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version to publish (for example 0.7.0)
        required: true
        type: string
      dry_run:
        description: Build, validate and dry-run every npm publish
        required: true
        default: true
        type: boolean
      confirm:
        description: Type "publish" to allow a real publication
        required: false
        default: ''
        type: string
      resume:
        description: Skip packages already published at this exact version
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  compatibility:
    name: Compatibility Node ${{ matrix.node }} / Next ${{ matrix.next }} / ${{ matrix.pm }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        node: [22, 24, 26]
        next: [15.5.28, 16.4.3]
        pm: [npm, pnpm]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: External consumer smoke
        run: pnpm test:consumer --next ${{ matrix.next }} --pm ${{ matrix.pm }} --skip-build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          CI: 'true'

  docker-build:
    name: Validate Docker image
    needs: compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: stacknext:release-check
          cache-from: type=gha,scope=stacknext-release
          cache-to: type=gha,mode=max,scope=stacknext-release

      - name: Docker runtime integration
        run: node scripts/docker-integration.mjs --image stacknext:release-check --require-docker

  publish:
    name: Publish ${{ inputs.version }}
    needs: [compatibility, docker-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - name: Require the default branch
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Releases must run from $DEFAULT_BRANCH, not $REF."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Check npm CLI
        run: |
          node --input-type=module -e "
            import { execFileSync } from 'node:child_process'
            const version = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim()
            const [major, minor, patch] = version.split('.').map(Number)
            const supported =
              major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)))
            console.log('npm', version)
            if (!supported) {
              console.error('npm 11.5.1 or newer is required for trusted publishing.')
              process.exit(1)
            }
          "

      - name: Require explicit confirmation for a real publication
        if: ${{ !inputs.dry_run && inputs.confirm != 'publish' }}
        run: |
          echo "Refusing to publish: set confirm to 'publish' or enable dry_run."
          exit 1

      - name: Verify requested version matches every package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs'
            const version = process.env.VERSION
            const files = ['package.json', 'apps/example-next-app/package.json']
            for (const entry of ['core','diagnostics','regression','next','drizzle','prisma','playwright','mcp','dashboard','cli']) {
              files.push('packages/' + entry + '/package.json')
            }
            const bad = []
            for (const file of files) {
              const manifest = JSON.parse(readFileSync(file, 'utf8'))
              if (manifest.version !== version) bad.push(file + ': ' + manifest.version)
            }
            const constants = [
              ['packages/cli/src/version.ts', 'CLI_VERSION'],
              ['packages/core/src/types.ts', 'STACKNEXT_SDK_VERSION'],
              ['packages/diagnostics/src/engine.ts', 'DIAGNOSTICS_ENGINE_VERSION'],
              ['packages/regression/src/constants.ts', 'STACKNEXT_REGRESSION_ENGINE_VERSION'],
            ]
            for (const [file, name] of constants) {
              const source = readFileSync(file, 'utf8')
              if (!source.includes(\"'\" + version + \"'\")) bad.push(name)
            }
            const skill = readFileSync('skills/stacknext-debugging/SKILL.md', 'utf8')
            if (!skill.includes('version: \"' + version + '\"')) bad.push('Agent Skill metadata.version')
            if (bad.length) {
              console.error('Version mismatch for ' + version + ':\n' + bad.join('\n'))
              process.exit(1)
            }
            console.log('All manifests and constants match ' + version)
          "

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit --prod

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Documentation checks
        run: pnpm check:docs

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package archives
        run: pnpm test:packages

      - name: End-to-end
        run: pnpm test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          CI: 'true'

      - name: Benchmarks
        run: |
          pnpm benchmark
          pnpm benchmark:diagnostics
        env:
          CI: 'true'

      - name: Publish dry run
        if: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
        run: pnpm release:publish --version "$VERSION" --dry-run --skip-gates

      - name: Publish with provenance
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
          RESUME: ${{ inputs.resume }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          args=(--version "$VERSION" --publish --skip-gates)
          if [ "$RESUME" = "true" ]; then
            args+=(--resume)
          fi
          pnpm release:publish "${args[@]}"

      - name: Upload release manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ inputs.version }}
          path: |
            release/publish/manifest.json
            release/publish/*.tgz
          if-no-files-found: warn
          retention-days: 14

  docker-publish:
    name: Publish Docker image
    needs: publish
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/stacknext" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ !contains(inputs.version, '-') }}
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Publish multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          cache-from: type=gha,scope=stacknext-release
          cache-to: type=gha,mode=max,scope=stacknext-release
